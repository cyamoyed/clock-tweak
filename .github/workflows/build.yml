# 自动编译打包：推送 main / PR 时构建并上传产物，推送版本标签（如 2.0.0 或 v2.0.0）时额外发布 Release
name: 构建打包

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*'] # 兼容 v2.0.0 与 2.0.0 两种标签风格（仓库历史标签为无前缀风格）
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 发布 Release 需要

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译打包 (windows-amd64)
    # 纯 Go 无 CGO，可在 Linux 上交叉编译，比 windows 运行器更快
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # 项目无第三方依赖（无 go.sum），关闭依赖缓存

      - name: 安装 go-winres
        run: |
          go install github.com/tc-hib/go-winres@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 生成资源文件（UAC 清单 / 版本信息）
        run: go-winres make --in winres/winres.json --out rsrc --arch amd64

      - name: 代码检查 (go vet)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go vet ./...

      - name: 编译
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w -H windowsgui" -o clock-tweak.exe .

      - name: 打包 zip
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            name="clock-tweak-${GITHUB_REF_NAME}-windows-amd64"
          else
            name="clock-tweak-${GITHUB_REF_NAME}-${GITHUB_SHA::7}-windows-amd64"
          fi
          name="${name//\//-}" # 分支名可能含斜杠，替换为连字符
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
          zip "${name}.zip" clock-tweak.exe readme.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}.zip
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG_NAME }}.zip
          generate_release_notes: true
